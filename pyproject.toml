[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosca-patins"
version = "0.1.0"
description = "Uma mosca simulada, controlada pelo conectoma real, aprende a andar de patins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
render = ["pillow>=10"]
data = ["remotezip>=0.12", "h5py>=3.10"]
search = ["cma>=4"]
brain = ["pandas>=2.1", "pyarrow>=15"]
# PyTorch fica fora das dependências porque a roda certa depende da máquina:
#   notebook (CPU):  pip install torch --index-url https://download.pytorch.org/whl/cpu
#   DGX Spark:       pip install torch --index-url https://download.pytorch.org/whl/cu130

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
